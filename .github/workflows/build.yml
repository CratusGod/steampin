name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch zapret (official release, hash-checked)
        shell: powershell
        run: .\tools\fetch-zapret.ps1
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\steampin.exe dist\SteamPin.exe
          (Get-FileHash dist\SteamPin.exe -Algorithm SHA256).Hash.ToLower() + '  SteamPin.exe' | Set-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SteamPin
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/SteamPin.exe dist/SHA256SUMS.txt --title "SteamPin ${{ github.ref_name }}" --generate-notes
